# Builds the web app in cloud mode and publishes it to GitHub Pages on every push to main.
#
# Needs two repository variables (Settings -> Secrets and variables -> Actions -> Variables), both public
# by design: VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY. The anon key can't read any data: every table
# has row-level security with no policies, and the API only answers the owner's signed-in session.
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build (cloud mode)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Set the VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository variables first." >&2
            exit 1
          fi
          npm run build
      # Pages must be enabled once with Source = "GitHub Actions" (Settings -> Pages).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
