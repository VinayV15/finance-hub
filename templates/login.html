<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2c1c42">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<script>try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark' } catch (e) {}</script>
<title>Finance Hub</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <form class="login-card" method="post" autocomplete="off">
    <div class="mark" aria-hidden="true"></div>
    <h1>Finance Hub</h1>
    <p class="muted">Enter your PIN</p>
    <input name="pin" type="password" inputmode="numeric" pattern="[0-9]*" autofocus required aria-label="PIN">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <button type="submit" class="btn primary">Unlock</button>
  </form>
</body>
</html>
